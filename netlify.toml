[build]
  command = "npm run build"
  publish = "dist"
  # Git builds exist for pull-request previews: production is deployed by
  # .github/workflows/release.yml from a tag. An ignore command that exits 0
  # cancels the build, so a push to main stops here. If CONTEXT is ever unset
  # this exits 1 and builds, which is the old behaviour rather than no site.
  ignore = "test \"$CONTEXT\" = \"production\""

[build.environment]
  NODE_VERSION = "24"

# Production is deployed by .github/workflows/release.yml on a tag. The Git
# integration stays for pull-request previews only. Response headers live in
# public/_headers so they apply to a CLI deploy as well as a build here.
