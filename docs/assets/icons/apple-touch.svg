  <rect
    x="13"
    y="12"
    width="38"
    height="32"
    rx="7"
    fill="#232a33"
    stroke="#d3a64c"
    stroke-width="2"
  />
  <rect x="19" y="18" width="26" height="19" rx="3" fill="#0f1216" opacity="0.55" />
  <rect x="13" y="48" width="38" height="4" rx="2" fill="#d3a64c" />
</svg>
